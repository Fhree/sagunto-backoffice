<div class="dashboard-container">
  <header class="view-header">
    <div class="header-titles">
      <span class="module-subtitle">DIRECTORIO DE AGRUPACIÓN</span>
      <h1>Listado de Saguntinos</h1>
      <p class="description">Búsqueda rápida y gestión del censo actual de miembros registrados</p>
    </div>
    
    <div class="header-actions">
      <div class="search-input">
        <i class="pi pi-search"></i>
        <input 
          type="text" 
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          placeholder="Buscar saguntino..." 
        >
      </div>
    </div>
  </header>

  <section class="table-wrapper">
    <p-table 
      #dt 
      [value]="saguntinos" 
      dataKey="saguntinoCode"
      [paginator]="true" 
      [rows]="10" 
      [rowsPerPageOptions]="[10, 25, 50]"
      [globalFilterFields]="['name', 'surname', 'saguntinoCode']">
      
      <ng-template #caption>
        <div class="table-caption">
          <span class="caption-title">Censo Oficial</span>
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th pSortableColumn="saguntinoCode" style="width: 20%;">
            Código <i class="pi pi-sort-alt"></i>
          </th>
          <th pSortableColumn="name" style="width: 40%;">
            Nombre <i class="pi pi-sort-alt"></i>
          </th>
          <th pSortableColumn="surname" style="width: 40%;">
            Apellido <i class="pi pi-sort-alt"></i>
          </th>
        </tr>
      </ng-template>

      <ng-template #body let-row>
        <tr class="clickable-row">
          <td class="user-cell">
            <span class="id-badge">{{ row.saguntinoCode }}</span>
          </td>
          <td>
            <span class="user-fullname">{{ row.name }}</span>
          </td>
          <td>
            <span class="user-fullname">{{ row.surname }}</span>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="3" class="empty-message">
            <i class="pi pi-info-circle success-icon"></i>
            <p>No se encontraron registros que coincidan con la búsqueda</p>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>
